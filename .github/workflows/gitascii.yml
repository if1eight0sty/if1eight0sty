name: Update GitAscii

on:
  workflow_dispatch:
  # gitascii.json lives on the gitascii branch, so listen there too.
  push:
    branches: [main, gitascii]
    paths:
      - gitascii.json
      - .github/workflows/gitascii.yml
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: gitascii-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Publish GitAscii SVGs
        uses: Igorcbraz/GitAscii/action@v2.4.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub rewrites same-repo paths in the README (/raw/main/...), which
      # always renders. External raw.githubusercontent URLs inside <picture>
      # do not, which is why the profile showed the alt text instead.
      - name: Mirror SVGs onto main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gitascii
          git checkout origin/gitascii -- profiles
          git add profiles
          if git diff --cached --quiet; then
            echo "no svg changes"
          else
            git commit -m "chore(gitascii): mirror profile svgs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main || { git pull --rebase origin main; git push origin HEAD:main; }
          fi
