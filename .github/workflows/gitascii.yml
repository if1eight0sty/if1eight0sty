name: Update GitAscii

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gitascii.json
      - .github/workflows/gitascii.yml

permissions:
  contents: write

concurrency:
  group: gitascii-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate and Publish GitAscii SVGs
        uses: Igorcbraz/GitAscii/action@v2.4.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
